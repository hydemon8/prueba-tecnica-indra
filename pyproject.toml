[project]
name = "linevision"
version = "0.1.0"
description = "Identificación de producto y orientación (yaw) para pick & pack con ML clásico (COIL-100)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "scikit-image>=0.22",
    "pillow>=10.0",
    "pandas>=2.1",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "mlflow>=2.14",
    "tabulate>=0.9",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "nbconvert>=7", "ipykernel>=6", "plotly>=5"]
# referencia moderna (solo comparación, no va a producción)
reference = ["torch>=2.2", "transformers>=4.40"]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linevision"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
