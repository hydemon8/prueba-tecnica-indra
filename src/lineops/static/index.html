<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistente de operación de visión</title>
<style>
  :root { --bg:#f4f5f3; --panel:#fff; --ink:#1c2526; --muted:#667274; --line:#dfe3e1; --accent:#00495a; --accent-ink:#fff;
          --ok:#1d7a4f; --warn:#a15c00; --bad:#a3262b; --chip:#eaf0ef; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12181a; --panel:#1b2326; --ink:#e7eceb; --muted:#93a1a3; --line:#2c373a;
          --accent:#5fb6c9; --accent-ink:#06262d; --ok:#5fc496; --warn:#e0a44f; --bad:#ef8a8e; --chip:#243034; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, "Segoe UI", sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; flex:1 1 220px; }
  select, input[type=text], input[type=password], textarea, button { font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:7px 10px; }
  button { cursor:pointer; } button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  main { display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:16px; padding:16px; max-width:1300px; margin:0 auto; }
  @media (max-width: 900px) { main { grid-template-columns:minmax(0,1fr); } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  #log { height:calc(100vh - 250px); min-height:320px; overflow-y:auto; padding:14px; }
  .msg { margin:0 0 14px; max-width:92%; } .msg.user { margin-left:auto; }
  .bubble { padding:10px 13px; border-radius:10px; border:1px solid var(--line); overflow-wrap:anywhere; }
  .user .bubble { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .bubble p { margin:0 0 8px; } .bubble p:last-child, .bubble ul:last-child { margin-bottom:0; } .bubble ul, .bubble ol { margin:0 0 8px; padding-left:20px; }
  .bubble h4 { margin:8px 0 4px; font-size:15px; } code { background:var(--chip); padding:1px 5px; border-radius:4px; font-size:13px; }
  .meta { font-size:12px; color:var(--muted); margin-top:4px; } details { margin-top:6px; font-size:13px; }
  summary { cursor:pointer; color:var(--muted); } .steps { margin:6px 0 0; padding:0; list-style:none; }
  .steps li { padding:3px 0; border-top:1px dashed var(--line); font-family:ui-monospace, Consolas, monospace; font-size:12px; overflow-wrap:anywhere; }
  .tag { display:inline-block; padding:0 7px; border-radius:10px; font-size:11px; background:var(--chip); }
  .tag.ok { color:var(--ok); } .tag.pending_approval { color:var(--warn); } .tag.err { color:var(--bad); }
  .evidence { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; align-items:flex-end; }
  .evidence figure { margin:0; text-align:center; font-size:11px; color:var(--muted); }
  .evidence img { width:84px; height:84px; object-fit:contain; background:#000; border-radius:6px; display:block; }
  form#f { display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); flex-wrap:wrap; }
  form#f textarea { flex:1 1 260px; min-height:44px; resize:vertical; }
  aside .card { padding:12px 14px; margin-bottom:16px; } aside h2 { font-size:14px; margin:0 0 8px; }
  .ap { border-top:1px solid var(--line); padding:8px 0; font-size:13px; } .ap pre { margin:4px 0; white-space:pre-wrap; font-size:12px; }
  .examples button { display:block; width:100%; text-align:left; margin-bottom:6px; font-size:13px; }
  .hint { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>Asistente de operación de visión <span class="hint" id="clock"></span></h1>
  <input type="password" id="code" placeholder="Código de acceso" hidden>
  <select id="user" aria-label="Usuario"></select>
  <button class="primary" id="login">Entrar</button>
</header>
<main>
  <section class="card">
    <div id="log"><p class="hint">Elige un usuario y pulsa Entrar. Cada usuario tiene un rol, una planta y unas líneas: el asistente solo le ofrece lo que su rol puede hacer.</p></div>
    <form id="f">
      <textarea id="text" placeholder="Escribe tu petición…" disabled></textarea>
      <input type="file" id="files" accept="image/*" multiple disabled aria-label="Adjuntar imágenes">
      <button class="primary" id="send" disabled>Enviar</button>
    </form>
  </section>
  <aside>
    <div class="card"><h2>Aprobaciones pendientes</h2><div id="approvals" class="hint">Sin sesión.</div></div>
    <div class="card examples"><h2>Ejemplos</h2><div id="examples"></div></div>
    <div class="card"><h2>Sesión</h2><div id="session" class="hint">—</div></div>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
const ROLES = {operator:"operario", supervisor:"supervisor", quality:"calidad", maintenance:"mantenimiento", ml_engineer:"ingeniería de ML", plant_manager:"gerente de planta"};
const EXAMPLES = ["¿Cómo va el turno 2 en la L1?", "¿Por qué subieron los rechazos a las 3 a. m. en la L1?", "Muéstrame la cola de revisión de la L1",
  "Hay agarres fallidos en la L2 desde las 15:30, ¿qué puede ser?", "Pausa la línea L2 por los agarres fallidos", "Genera la entrega del turno 3 de la L1"];
let S = null, totals = {tokens:0, cost:0, turns:0};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function md(text) {  // Markdown mínimo: títulos, listas, negrita, código. Todo el texto se escapa antes.
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  let html = "", list = null;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const line of text.split("\n")) {
    let m;
    if ((m = line.match(/^\s*[-*]\s+(.*)/))) { if (list !== "ul") { close(); html += "<ul>"; list = "ul"; } html += `<li>${inline(m[1])}</li>`; }
    else if ((m = line.match(/^\s*\d+\.\s+(.*)/))) { if (list !== "ol") { close(); html += "<ol>"; list = "ol"; } html += `<li>${inline(m[1])}</li>`; }
    else if ((m = line.match(/^#{1,4}\s+(.*)/))) { close(); html += `<h4>${inline(m[1])}</h4>`; }
    else if (line.trim()) { close(); html += `<p>${inline(line)}</p>`; }
    else close();
  }
  close(); return html;
}
async function api(path, opts = {}) {
  const headers = Object.assign({}, opts.headers, S ? {Authorization: "Bearer " + S.token} : {});
  const r = await fetch(path, Object.assign({}, opts, {headers}));
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || body.message || ("Error " + r.status));
  return body;
}
function add(role, html) {
  const d = document.createElement("div"); d.className = "msg " + role; d.innerHTML = html; $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight; return d;
}
async function blobUrl(path) { const r = await fetch(path, {headers: {Authorization: "Bearer " + S.token}}); return r.ok ? URL.createObjectURL(await r.blob()) : ""; }
async function evidenceHtml(list) {
  let out = "";
  for (const e of list) {
    const own = await blobUrl(`/api/images/${e.image_id}?session_id=${S.session_id}`);
    out += `<div class="evidence"><figure><img src="${own}" alt="Imagen cargada ${esc(e.filename)}">${esc(e.filename)}<br><b>${esc(e.decision)}</b></figure>`;
    for (const v of e.similar_views_by_appearance)
      out += `<figure><img src="${esc(v.reference_url)}" alt="Vista de referencia del producto ${v.object_id} a ${v.angle_deg} grados">SKU ${v.object_id} · ${v.angle_deg}°</figure>`;
    out += "</div>";
  }
  return out;
}
async function refreshApprovals() {
  if (!S) return;
  const a = await api("/api/approvals");
  $("approvals").className = "";
  $("approvals").innerHTML = (a.pending.length ? "" : '<p class="hint">Ninguna.</p>') + a.pending.map(p =>
    `<div class="ap"><b>${esc(p.action)}</b> <span class="hint">${esc(p.approval_id)}</span><pre>${esc(JSON.stringify(p.args))}</pre>
     <span class="hint">Solicita: ${esc(p.requested_by)}</span><br>` + (p.can_approve
      ? `<button data-id="${esc(p.approval_id)}" data-ok="1">Aprobar</button> <button data-id="${esc(p.approval_id)}" data-ok="0">Rechazar</button>`
      : '<span class="hint">Tu rol no puede aprobarla.</span>') + "</div>").join("")
    + a.recent.map(r => `<div class="ap hint">${esc(r.approval_id)} · ${esc(r.action)} · <b>${esc(r.status)}</b> por ${esc(r.decided_by)}</div>`).join("");
}
$("approvals").addEventListener("click", async ev => {
  const b = ev.target.closest("button[data-id]"); if (!b) return;
  const approve = b.dataset.ok === "1";
  if (!confirm((approve ? "¿Aprobar y ejecutar " : "¿Rechazar ") + b.dataset.id + "?")) return;
  try {
    const r = await api(`/api/approvals/${b.dataset.id}/decision`, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({approve})});
    add("assistant", `<div class="bubble"><b>Decisión humana:</b> ${esc(b.dataset.id)} → ${esc(r.ok ? r.data.status : r.error.code + ": " + r.error.message)}</div>`);
  } catch (e) { alert(e.message); }
  refreshApprovals();
});
async function send(text) {
  const files = $("files").files, fd = new FormData();
  fd.append("session_id", S.session_id); fd.append("message", text);
  for (const f of files) fd.append("files", f);
  add("user", `<div class="bubble">${esc(text)}${files.length ? `<div class="meta" style="color:inherit">${files.length} imagen(es) adjunta(s)</div>` : ""}</div>`);
  $("text").value = ""; $("files").value = ""; $("send").disabled = true;
  const wait = add("assistant", '<div class="bubble hint">Trabajando…</div>');
  try {
    const r = await api("/api/chat", {method:"POST", body: fd});
    const steps = r.steps.map(s => `<li><span class="tag ${s.ok ? s.outcome : "err"}">${esc(s.outcome)}</span> ${esc(s.tool)}(${esc(JSON.stringify(s.args))}) · ${s.latency_ms} ms</li>`).join("");
    wait.innerHTML = `<div class="bubble">${md(r.text)}${await evidenceHtml(r.evidence)}</div>
      <div class="meta">${r.steps.length} tools · ${r.usage.total_tokens} tokens · ~$${r.cost_usd.toFixed(4)} · ${r.latency_s} s · fin: ${esc(r.stop_reason)}</div>`
      + (steps ? `<details><summary>Qué hizo el asistente</summary><ul class="steps">${steps}</ul></details>` : "");
    totals.tokens += r.usage.total_tokens; totals.cost += r.cost_usd; totals.turns++;
    $("session").textContent = `${S.session_id} · ${totals.turns} turnos · ${totals.tokens} tokens · ~$${totals.cost.toFixed(4)}`;
  } catch (e) { wait.innerHTML = `<div class="bubble">No se pudo completar la petición: ${esc(e.message)}</div>`; }
  $("send").disabled = false; $("log").scrollTop = $("log").scrollHeight; refreshApprovals();
}
$("f").addEventListener("submit", ev => { ev.preventDefault(); const t = $("text").value.trim(); if (S && t) send(t); });
$("text").addEventListener("keydown", ev => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); $("f").requestSubmit(); } });
$("login").addEventListener("click", async () => {
  try {
    S = null;
    const r = await api("/api/login", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({user_id: $("user").value, access_code: $("code").value})});
    S = r; totals = {tokens:0, cost:0, turns:0};
    $("log").innerHTML = ""; $("clock").textContent = "· hora de planta " + r.plant_time.replace("T", " ");
    add("assistant", `<div class="bubble">Sesión de <b>${esc(r.user.name)}</b> (${esc(ROLES[r.user.role])}), planta ${esc(r.user.plant_id)}, líneas ${esc(JSON.parse(r.user.lines).join(", "))}. Tools disponibles para este rol: ${r.tools.length}.</div>`);
    for (const id of ["text", "files", "send"]) $(id).disabled = false;
    $("session").textContent = r.session_id; refreshApprovals();
  } catch (e) { alert(e.message); }
});
(async () => {
  const u = await api("/api/users");
  $("code").hidden = !u.access_code_required;
  $("user").innerHTML = u.users.map(x => `<option value="${esc(x.user_id)}">${esc(x.name)} — ${esc(ROLES[x.role])} · ${esc(x.plant_id)}</option>`).join("");
  $("examples").innerHTML = EXAMPLES.map(e => `<button type="button">${esc(e)}</button>`).join("");
  $("examples").addEventListener("click", ev => { if (ev.target.tagName === "BUTTON" && S) { $("text").value = ev.target.textContent; $("text").focus(); } });
})();
</script>
</body>
</html>
