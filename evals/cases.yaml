    answer_all: ['SOP-MNT-001', 'pinza|ventosa|vacío', '47']

- id: diag-02-ticket
  title: Diagnóstico y creación del ticket en dos turnos
  category: diagnóstico
  user: u-mnt-01
  turns:
    - {say: "Hay muchos agarres fallidos en la L2 desde las 15:30. ¿Qué puede ser?"}
    - {say: "Crea el ticket con severidad alta."}
  expect:
    tools: [{name: get_grasp_failures}, {name: create_ticket, args: {line_id: L2, severity: high}}]
