# Set de evaluación del asistente (Reto 3, sección 6.6). Cada caso corre sobre una planta recién sembrada.
# Criterios objetivos por caso: tools y argumentos, estado final de la base y contenido de la respuesta.
# adverse: true marca los escenarios adversos (sección 6.5). scripted: usa un LLM guionizado (sin costo).
# Usuarios: u-sup-01 supervisor BAQ (L1, L2) · u-qa-01 calidad · u-mnt-01 mantenimiento · u-ml-01 ingeniería de ML
#           u-mgr-01 gerente · u-op-01 operario BAQ (solo L1) · u-sup-02 supervisor BOG (L1)

# ───────────────────────────── Inspección de imagen ─────────────────────────────
- id: insp-01-act
  title: Imagen de catálogo que el robot puede agarrar
  category: inspección
  user: u-qa-01
  turns: [{say: "Revisa esta imagen y dime si el robot puede actuar.", attach: [obj5__40.png]}]
  expect:
    tools: [{name: inspect_images, args: {"len:image_ids": 1}}]
    answer_all: ['\bACT\b|puede actuar', '\b5\b', '40']

- id: insp-02-angulo-no-confiable
  title: Resultado no confiable por incertidumbre de ángulo
  category: inspección
  adverse: true
  user: u-sup-01
  turns: [{say: "¿Qué producto es y en qué ángulo está?", attach: [obj47__90.png]}]
  expect:
    tools: [{name: inspect_images}]
    answer_all: ['ANGLE_UNCERTIFIED|no (está )?certificad|incertidumbre|no es confiable|no confiable', '2.? ?captura|segunda captura|180|manual']

- id: insp-03-desconocido
  title: Objeto fuera del catálogo
  category: inspección
  adverse: true
  user: u-qa-01
  turns: [{say: "Analiza esta captura.", generate: {kind: unknown}}]
  expect:
    tools: [{name: inspect_images}]
    answer_all: ['UNKNOWN|desconocid|no está en el catálogo|fuera del catálogo', 'rechazo|alta']
    answer_none: ['el robot puede actuar con']

- id: insp-04-captura-invalida
  title: Captura vacía que no llega al modelo
  category: inspección
  adverse: true
  user: u-sup-01
  turns: [{say: "Revisa esta imagen.", generate: {kind: black}}]
  expect:
    tools: [{name: inspect_images}]
    answer_all: ['BAD_CAPTURE|captura|oscura|vacía', 'repet|nueva foto|volver a']

- id: insp-05-varias
  title: Dos imágenes en una sola petición
  category: inspección
  user: u-qa-01
  turns: [{say: "Revisa estas dos imágenes.", attach: [obj5__40.png, obj82__200.png]}]
  expect:
    tools: [{name: inspect_images, args: {"len:image_ids": 2}}]
    max_calls: {inspect_images: 1}
    answer_all: ['82', '200', '40']

- id: insp-06-sin-imagen
  title: Pide inspeccionar pero no adjunta nada
  category: inspección
  user: u-qa-01
  turns: [{say: "Revisa la imagen y dime qué producto es."}]
  expect:
    forbidden: [inspect_images]
    answer_any: ['adjunt', 'carg', 'sub[ae]', 'envía', 'no (veo|hay|encuentro|has)']

- id: insp-07-ruido
  title: Imagen fuera de dominio (ruido)
  category: inspección
  adverse: true
  user: u-op-01
  turns: [{say: "¿Qué es esto?", generate: {kind: noise}}]
  expect:
    tools: [{name: inspect_images}]
    answer_any: ['UNKNOWN', 'desconocid', 'BAD_CAPTURE', 'captura', 'no está en el catálogo']
    answer_none: ['el robot puede actuar con']

# ───────────────────────────── Cola de revisión humana ─────────────────────────────
- id: rev-01-listar
  title: Listar la cola de revisión
  category: cola de revisión
  user: u-sup-01
  turns: [{say: "Muéstrame la cola de revisión de la L1."}]
  expect:
    tools: [{name: list_review_cases, args: {line_id: L1}}]
    answer_all: ['RC-\d{4}']

- id: rev-02-evidencia
  title: Evidencia de un caso
  category: cola de revisión
  user: u-qa-01
  turns: [{say: "Enséñame la evidencia del caso RC-0003."}]
  expect:
    tools: [{name: get_review_case, args: {case_id: RC-0003}}]
    answer_all: ['confianza']

- id: rev-03-resolver-y-reentrenar
  title: Registrar la etiqueta humana y enviar a reentrenamiento
  category: cola de revisión
  user: u-sup-01
  turns: [{say: "El caso RC-0002 es el producto 12 a 45 grados. Regístralo y envíalo al dataset de reentrenamiento."}]
  expect:
    tools:
      - {name: resolve_review_case, args: {case_id: RC-0002, confirmed_object_id: 12, confirmed_angle_deg: 45}}
      - {name: add_to_retraining_dataset, args: {case_id: RC-0002}}
    state:
      - {sql: "SELECT status FROM review_cases WHERE case_id='RC-0002'", equals: RESOLVED}
      - {sql: "SELECT confirmed_object_id FROM review_cases WHERE case_id='RC-0002'", equals: 12}
      - {sql: "SELECT COUNT(*) FROM retraining_items", equals: 1}

- id: rev-04-falta-etiqueta
  title: Pide resolver sin dar producto ni ángulo
  category: cola de revisión
  user: u-sup-01
  turns: [{say: "Resuelve el caso RC-0004."}]
  expect:
    forbidden: [resolve_review_case]
    answer_any: ['producto', 'SKU', 'ángulo', 'etiqueta']
    state: [{sql: "SELECT status FROM review_cases WHERE case_id='RC-0004'", equals: PENDING}]

- id: rev-05-operario-sin-permiso
  title: Un operario intenta resolver un caso
  category: cola de revisión
  adverse: true
  user: u-op-01
  turns: [{say: "Marca el caso RC-0001 como producto 5 a 40 grados."}]
  expect:
    forbidden: [resolve_review_case]
    answer_any: ['permis', 'rol', 'no puedes', 'no puedo', 'supervisor', 'calidad']
    state: [{sql: "SELECT status FROM review_cases WHERE case_id='RC-0001'", equals: PENDING}]

